<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="美容業界 BtoB メーカー営業専用 — ソリューション営業 AI Builder">
  <title>AI Builder — 美容 BtoB 営業</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="app">

    <!-- ===== ホーム画面 ===== -->
    <section id="view-home" class="view view--active" aria-label="ホーム">

      <header class="hero">
        <div class="hero__badge">美容 BtoB · ソリューション営業</div>
        <h1 class="hero__title">AI Builder</h1>
        <p class="hero__subtitle">美容機器・商材メーカー営業向け — 質問に答えるだけで、お客様の経営課題を解決する AI プロンプトを生成</p>
      </header>

      <!-- 検索バー -->
      <div class="search-bar">
        <svg class="search-bar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          id="search-input"
          class="search-bar__input"
          type="search"
          placeholder="営業・提案書・メルマガなどを検索..."
          autocomplete="off"
        >
      </div>

      <!-- 新しいAIを作る -->
      <button id="btn-new-ai" class="btn btn--primary btn--full btn-new-ai" type="button">
        <span class="btn-new-ai__plus">＋</span> 新しいAIを作る
      </button>

      <!-- 最近使ったAI -->
      <section class="home-section">
        <h2 class="home-section__title">最近使ったAI</h2>
        <div id="recent-list" class="list-group"></div>
      </section>

      <!-- 人気カテゴリ -->
      <section class="home-section">
        <h2 class="home-section__title">人気カテゴリ</h2>
        <div id="popular-grid" class="category-grid category-grid--compact"></div>
      </section>

      <!-- お気に入り -->
      <section class="home-section">
        <h2 class="home-section__title">お気に入り</h2>
        <div id="favorites-list" class="list-group"></div>
      </section>

      <!-- 全カテゴリ -->
      <section id="section-all-categories" class="home-section">
        <h2 class="home-section__title">すべてのカテゴリ</h2>
        <div id="all-categories-grid" class="category-grid"></div>
      </section>

    </section>

    <!-- ===== 質問画面 ===== -->
    <section id="view-questions" class="view" aria-label="質問" hidden>

      <header class="top-bar">
        <button id="btn-top-home" class="top-bar__home" type="button">
          <span aria-hidden="true">🏠</span> ホーム
        </button>
        <div class="top-bar__progress-info">
          <span id="progress-label" class="top-bar__label">質問 1 / 8</span>
          <div id="progress-segments" class="progress-segments" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
      </header>

      <div id="question-card" class="question-card">
        <span id="question-number" class="question-card__number"></span>
        <h2 id="question-text" class="question-card__title"></h2>
        <div id="options-container" class="options"></div>
        <div id="text-input-area" class="text-input-area" hidden>
          <textarea id="text-input" class="text-input" rows="4" placeholder="自由に入力してください"></textarea>
        </div>
      </div>

      <nav class="question-nav">
        <button id="btn-prev" class="btn btn--secondary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          戻る
        </button>
        <button id="btn-next" class="btn btn--primary" type="button" disabled>
          次へ
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </nav>
    </section>

    <!-- ===== 結果画面 ===== -->
    <section id="view-result" class="view" aria-label="完成したプロンプト" hidden>
      <header class="result-header">
        <div class="result-header__icon" aria-hidden="true">✨</div>
        <h2 class="result-header__title">プロンプトが完成しました</h2>
        <p id="result-category-label" class="result-header__subtitle"></p>
      </header>

      <div class="result-card">
        <pre id="prompt-output" class="result-card__prompt"></pre>
      </div>

      <div id="quality-check" class="quality-card">
        <div class="quality-card__stars" id="quality-stars" aria-label="品質評価"></div>
        <div class="quality-card__score">
          <span class="quality-card__score-label">品質スコア</span>
          <span id="quality-score" class="quality-card__score-value"></span>
        </div>
        <div class="quality-card__missing">
          <p class="quality-card__missing-title">不足している情報</p>
          <ul id="quality-missing-list" class="quality-card__missing-list"></ul>
        </div>
      </div>

      <div class="result-actions">
        <button id="btn-copy" class="btn btn--primary btn--full" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="btn-copy-label">コピー</span>
        </button>
        <button id="btn-favorite" class="btn btn--ghost btn--full" type="button">☆ お気に入りに追加</button>
        <button id="btn-restart" class="btn btn--secondary btn--full" type="button">最初から</button>
        <button id="btn-home" class="btn btn--ghost btn--full" type="button">ホームへ戻る</button>
      </div>
    </section>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
