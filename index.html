<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="質問に答えるだけで最高品質のプロンプトを生成 — AI Builder">
  <title>AI Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== メインアプリコンテナ ===== -->
  <div id="app" class="app">

    <!-- ===== ホーム画面 ===== -->
    <section id="view-home" class="view view--active" aria-label="ホーム">
      <header class="hero">
        <div class="hero__badge">Prompt Generator</div>
        <h1 class="hero__title">AI Builder</h1>
        <p class="hero__subtitle">質問に答えるだけで最高品質のプロンプトを生成</p>
      </header>

      <div id="category-grid" class="category-grid" role="list">
        <!-- script.js がカードを動的生成 -->
      </div>
    </section>

    <!-- ===== 質問画面 ===== -->
    <section id="view-questions" class="view" aria-label="質問" hidden>
      <header class="question-header">
        <button id="btn-back-home" class="btn-icon" type="button" aria-label="ホームに戻る">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span id="question-category-label" class="question-header__label"></span>
      </header>

      <!-- 進捗バー -->
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress__bar"></div>
      </div>
      <p id="progress-text" class="progress__text"></p>

      <!-- 質問カード -->
      <div class="question-card">
        <h2 id="question-text" class="question-card__title"></h2>
        <div id="options-container" class="options" role="listbox">
          <!-- 選択肢ボタンを動的生成 -->
        </div>
      </div>

      <!-- ナビゲーション -->
      <nav class="question-nav">
        <button id="btn-prev" class="btn btn--secondary" type="button" disabled>戻る</button>
        <button id="btn-next" class="btn btn--primary" type="button" disabled>次へ</button>
      </nav>
    </section>

    <!-- ===== 結果画面 ===== -->
    <section id="view-result" class="view" aria-label="完成したプロンプト" hidden>
      <header class="result-header">
        <div class="result-header__icon" aria-hidden="true">✨</div>
        <h2 class="result-header__title">プロンプトが完成しました</h2>
        <p id="result-category-label" class="result-header__subtitle"></p>
      </header>

      <div class="result-card">
        <pre id="prompt-output" class="result-card__prompt"></pre>
      </div>

      <div class="result-actions">
        <button id="btn-copy" class="btn btn--primary btn--full" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="btn-copy-label">コピー</span>
        </button>
        <button id="btn-restart" class="btn btn--secondary btn--full" type="button">最初から</button>
      </div>
    </section>

  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
